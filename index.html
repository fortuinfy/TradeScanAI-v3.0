<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeScan v3.1</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">TradeScan <span class="version">v3.1</span></div>
            <div class="header-right">
                <div id="live-clock" class="clock">--:--:--</div>
                <button id="btn-screenshot" class="btn-icon">📸 Grab a Screenshot</button>
            </div>
        </header>

        <section class="mode-selector card">
            <button class="mode-btn active" data-mode="newScan">New Scan (EOD)</button>
            <button class="mode-btn" data-mode="watchlist">Watchlist (Intraday)</button>
            <button class="mode-btn" data-mode="activeTrade">Active Trade</button>
        </section>

        <main>
            <section class="input-section card" id="core-technicals">
                <h2>Core Technicals</h2>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label for="stockName">Stock Name</label>
                        <input type="text" id="stockName" placeholder="e.g. RELIANCE">
                    </div>
                    <div class="input-group">
                        <label for="timeframe">Timeframe</label>
                        <select id="timeframe">
                            <option value="Daily">Daily</option>
                            <option value="15 Min">15 Min</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="ltp">LTP (Last Traded Price)</label>
                        <input type="number" id="ltp" step="any" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="ema20">EMA 20</label>
                        <input type="number" id="ema20" step="any" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="ema50">EMA 50</label>
                        <input type="number" id="ema50" step="any" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="rsi">RSI (14)</label>
                        <input type="number" id="rsi" step="any" placeholder="0.00">
                    </div>
                </div>
            </section>

            <section class="input-section card hidden" id="watchlist-params">
                <h2>Watchlist Parameters</h2>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label for="wl-originalSetup">Original Setup (Lock)</label>
                        <select id="wl-originalSetup">
                            <option value="CB">Continuation Breakout (CB)</option>
                            <option value="PC">Pullback Continuation (PC)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="wl-triggerLow">Prev. Trigger Low</label>
                        <input type="number" id="wl-triggerLow" step="any">
                    </div>
                    <div class="input-group">
                        <label for="wl-triggerHigh">Prev. Trigger High</label>
                        <input type="number" id="wl-triggerHigh" step="any">
                    </div>
                    <div class="input-group">
                        <label for="wl-stopLoss">Prev. Stop Loss</label>
                        <input type="number" id="wl-stopLoss" step="any">
                    </div>
                    <div class="input-group">
                        <label for="wl-target">Prev. Target</label>
                        <input type="number" id="wl-target" step="any">
                    </div>
                </div>
            </section>

            <section class="input-section card hidden" id="active-trade-params">
                <h2>Active Trade Parameters</h2>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label for="at-originalSetup">Original Setup (Lock)</label>
                        <select id="at-originalSetup">
                            <option value="CB">Continuation Breakout (CB)</option>
                            <option value="PC">Pullback Continuation (PC)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="at-entryPrice">Executed Entry Price</label>
                        <input type="number" id="at-entryPrice" step="any">
                    </div>
                    <div class="input-group">
                        <label for="at-currentSL">Current Stop Loss</label>
                        <input type="number" id="at-currentSL" step="any">
                    </div>
                    <div class="input-group">
                        <label for="at-currentTarget">Current Target</label>
                        <input type="number" id="at-currentTarget" step="any">
                    </div>
                    <div class="input-group">
                        <label for="at-openQuantity">Current Open Quantity</label>
                        <input type="number" id="at-openQuantity" step="1">
                    </div>
                </div>
            </section>

            <section class="input-section card">
                <div class="toggle-header">
                    <h2>Advanced Momentum (Optional)</h2>
                    <label class="switch">
                        <input type="checkbox" id="momentum-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <div id="momentum-inputs" class="hidden">
                    <p class="helper-text">Enter data for the last 5 candles. Volume supports K, L, M, Cr, B, T multipliers.</p>
                    <div class="candle-container" id="candle-blocks">
                        </div>
                </div>
            </section>

            <div class="action-buttons">
                <button id="btn-runAnalysis" class="btn-primary">Run Analysis</button>
                <button id="btn-resetAll" class="btn-danger">Reset All</button>
            </div>

            <section id="output-dashboard" class="hidden">
                <hr>
                <div id="analysis-overview" class="overview-header"></div>
                
                <div id="verdict-card" class="result-card"></div>
                
                <div id="partial-exit-card" class="result-card hidden amber-alert"></div>
                
                <div id="metrics-container" class="grid-cards">
                    <div id="setup-card" class="metric-card"></div>
                    <div id="momentum-card" class="metric-card hidden"></div>
                    <div id="trade-plan-card" class="metric-card"></div>
                </div>

                <div id="ai-reasoning-card" class="result-card reasoning-box">
                    <h3>Engine Reasoning</h3>
                    <ul id="reasoning-list"></ul>
                </div>
            </section>
        </main>
    </div>

    <script src="utils/validationUtils.js"></script>
    <script src="utils/volumeParser.js"></script>
    <script src="engines/setupEngine.js"></script>
    <script src="engines/momentumNewScan.js"></script>
    <script src="engines/momentumWatchlist.js"></script>
    <script src="engines/momentumTrade.js"></script>
    <script src="engines/tradePlanEngine.js"></script>
    <script src="engines/positionSizeEngine.js"></script>
    <script src="engines/newScanEngine.js"></script>
    <script src="engines/watchlistEngine.js"></script>
    <script src="engines/tradeManagementEngine.js"></script>
    <script src="engines/reasoningNewScan.js"></script>
    <script src="engines/reasoningWatchlist.js"></script>
    <script src="engines/reasoningTrade.js"></script>
    <script src="engine/analysisEngine.js"></script>
    <script src="config/config.js"></script>
    <script src="script.js"></script>
</body>
</html>
